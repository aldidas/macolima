name: Macolima
options:
  bundleIdPrefix: dev.aldidas
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "5.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
packages:
  MacolimaKit:
    path: Packages/MacolimaKit
targets:
  Macolima:
    type: application
    platform: macOS
    sources:
      - Sources/Macolima
      - Resources
    dependencies:
      - package: MacolimaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aldidas.macolima
        PRODUCT_NAME: Macolima
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Macolima
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Macolima:
    build:
      targets:
        Macolima: all
    run:
      config: Debug
    test:
      config: Debug
